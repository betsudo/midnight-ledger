[workspace]
package.license = "Apache-2.0"
package.repository = "https://github.com/midnightntwrk/midnight-ledger"
members = [
    "zswap",
    "ledger",
    "ledger-wasm",
    "proof-server",
    "onchain-runtime",
    "onchain-runtime-wasm",
    "onchain-state",
    "onchain-vm",
    "storage",
    "zkir",
    "zkir-wasm",
    "transient-crypto",
    "base-crypto",
    "base-crypto-derive",
    "coin-structure",
    "serialize",
    "serialize-macros",
    "generate-cost-model",
    "wasm-proving-demos/zkir-mt",
    "static",
    "storage-core"
]
default-members = [
    "zswap",
    "ledger",
    "onchain-runtime",
    "onchain-state",
    "onchain-vm",
    "storage",
    "zkir",
    "base-crypto",
    "base-crypto-derive",
    "transient-crypto",
    "coin-structure",
    "serialize",
    "serialize-macros",
    "generate-cost-model",
]
resolver = "2"
exclude = [
    "scripts/hardfork_version_patch"
]

# Pretty much every dependency is crypto.
# If there's one thing I know about it, it's that we don't want the molasses
# of unoptimized crypto.
[profile.dev.package."*"]
opt-level = 2
[profile.test.package."*"]
opt-level = 2

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Keep local Ledger packages unified while selecting unpublished Ledger9 proof
# and ZKIR v3 candidates from immutable betsudo commits.
[patch.crates-io]
midnight-base-crypto = { path = "base-crypto" }
midnight-serialize = { path = "serialize" }
# midnight-zkir v3 asks crates.io for transient-crypto ^3.0.0; resolve it to
# the in-tree copy so both share one set of types.
midnight-transient-crypto = { path = "transient-crypto" }
midnight-curves = { git = "https://github.com/betsudo/midnight-zk.git", rev = "763bfbc1e38b202153c20063b108f04e10140ad7" }
midnight-circuits = { git = "https://github.com/betsudo/midnight-zk.git", rev = "763bfbc1e38b202153c20063b108f04e10140ad7" }
midnight-proofs = { git = "https://github.com/betsudo/midnight-zk.git", rev = "763bfbc1e38b202153c20063b108f04e10140ad7" }
midnight-zk-stdlib = { git = "https://github.com/betsudo/midnight-zk.git", rev = "763bfbc1e38b202153c20063b108f04e10140ad7" }
midnight-zkir = { git = "https://github.com/betsudo/midnight-zkir.git", rev = "614dadc171e863f1a964ea19bb5df452a4e61034" }

# sha3-circuit names upstream ZK as a Git source. Bind it to the same proof
# commit so the graph cannot silently mix proof implementations.
[patch."https://github.com/midnightntwrk/midnight-zk"]
midnight-proofs = { git = "https://github.com/betsudo/midnight-zk.git", rev = "763bfbc1e38b202153c20063b108f04e10140ad7" }

[workspace.metadata.spellcheck]
config = ".spellcheck/cargo-spellcheck.toml"

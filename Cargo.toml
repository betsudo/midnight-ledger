[workspace]
package.license = "Apache-2.0"
package.repository = "https://github.com/midnightntwrk/midnight-ledger"
members = [
    "zswap",
    "ledger",
    "ledger-wasm",
    "proof-server",
    "onchain-runtime",
    "onchain-runtime-wasm",
    "onchain-state",
    "onchain-vm",
    "storage",
    "zkir",
    "zkir-wasm",
    "transient-crypto",
    "base-crypto",
    "base-crypto-derive",
    "coin-structure",
    "serialize",
    "serialize-macros",
    "generate-cost-model",
    "wasm-proving-demos/zkir-mt",
    "static",
    "storage-core"
]
default-members = [
    "zswap",
    "ledger",
    "onchain-runtime",
    "onchain-state",
    "onchain-vm",
    "storage",
    "zkir",
    "base-crypto",
    "base-crypto-derive",
    "transient-crypto",
    "coin-structure",
    "serialize",
    "serialize-macros",
    "generate-cost-model",
]
resolver = "2"
exclude = [
    "scripts/hardfork_version_patch"
]

# Pretty much every dependency is crypto.
# If there's one thing I know about it, it's that we don't want the molasses
# of unoptimized crypto.
[profile.dev.package."*"]
opt-level = 2
[profile.test.package."*"]
opt-level = 2

[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"

# Keep the released 0.8.2 proof format while selecting the additive context
# adapters by immutable source commits. The V2 path still uses the in-tree IR.
[patch.crates-io]
midnight-curves = { git = "https://github.com/betsudo/midnight-zk", rev = "e563d730f5b21a85283a4a379e0b0979b04832aa" }
midnight-proofs = { git = "https://github.com/betsudo/midnight-zk", rev = "e563d730f5b21a85283a4a379e0b0979b04832aa" }
midnight-zk-stdlib = { git = "https://github.com/betsudo/midnight-zk", rev = "e563d730f5b21a85283a4a379e0b0979b04832aa" }
midnight-zkir = { git = "https://github.com/betsudo/midnight-zkir", rev = "d8667b9eae463de16dab7934cdd09e827a68ae24" }
midnight-base-crypto = { path = "base-crypto" }
midnight-serialize = { path = "serialize" }
# midnight-zkir v3 asks crates.io for transient-crypto ^3.0.0; resolve it to
# the in-tree copy so both share one set of types.
midnight-transient-crypto = { path = "transient-crypto" }

[workspace.metadata.spellcheck]
config = ".spellcheck/cargo-spellcheck.toml"
